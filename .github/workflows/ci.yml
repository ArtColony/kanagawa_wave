# Render every gallery piece with the pscat release pinned in .pscat-version,
# with strict lint (a stack or gsave leak, or an error, fails the build).
# The renders are uploaded as an artifact to look at.
name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install pscat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat .pscat-version)"
          t="pscat-$v-x86_64-unknown-linux-musl"
          cd "$RUNNER_TEMP"
          gh release download "v$v" -R PSCatLabs/pscat -p "$t.tar.gz" -p SHA256SUMS
          sha256sum -c SHA256SUMS --ignore-missing
          tar xzf "$t.tar.gz"
          echo "$RUNNER_TEMP/$t" >> "$GITHUB_PATH"
      - run: pscat --version
      - run: scripts/render.sh
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: renders
          path: renders/
